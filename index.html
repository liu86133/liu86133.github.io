<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 | 作业五</title>
    <style>
        /* 源码注释：这部分是让页面变好看的魔法 (CSS样式) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 800px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .header-bg {
            background: #2d3748;
            height: 100px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            background: #edf2f7;
            border-radius: 50%;
            margin: -60px auto 0 auto;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #4a5568;
            background: #cbd5e0;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin: 15px 0 5px;
            color: #1a202c;
        }

        .title {
            color: #667eea;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .bio {
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: left;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }

        .btn {
            background: #f7fafc;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            color: #2d3748;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }

        .btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            font-size: 0.8rem;
            color: #a0aec0;
        }

        /* 让手机上看也好看 */
        @media (max-width: 640px) {
            .content { padding: 20px; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-bg"></div>
        <div class="profile-pic">
            <!-- 这里你可以改成文字或者图片，如果是图片用 <img src="你的图片链接.jpg"> 替换 -->
            📷
        </div>
        <div class="content">
            <!-- ************ 1. 小齐 ************ -->
            <h1>[小齐]</h1>
            <!-- ************ 2. 热爱AI技术的自由职业者 ************ -->
            <div class="title">学生 / 开发者 / 未来之星</div>
            
            <div class="bio">
                <!-- ************ 3. 请把这里改成你的自我介绍 ************ -->
                <p>👋 你好！我是 小齐，一名热爱AI技术的自由职业者。</p>
                <p>✨ 我对 AI 编程、Web 开发和 [你的爱好] 充满热情。</p>
                <p>🎯 目前正在努力学习前端知识，目标是成为一名全栈工程师。</p>
                <p>📖 座右铭：代码改变世界，坚持成就梦想。</p>
            </div>

            <div class="links">
                <!-- ************ 4. 请把这里的 # 改成你的真实链接（没有可以删掉这一行） ************ -->
                <a href="#" class="btn">GitHub</a>
                <a href="#" class="btn">个人博客</a>
                <a href="#" class="btn">📧 联系我</a>
            </div>
            
            <div class="footer">
                © 2026 [小齐] | 个人介绍主页 | 作业五
            </div>
        </div>
    </div>
</body>
</html>
